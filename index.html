<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/ Kahapatvilagama Vidyalaya</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Light Theme Variables (Default) */
        :root {
            --primary: #0a192f;
            --secondary: #172a45;
            --accent: #fca311;
            --accent-hover: #e59200;
            --text-dark: #2d3748;
            --text-light: #f8f9fa;
            --bg-light: #f4f7f6;
            --card-bg: #ffffff;
            --card-border: rgba(0, 0, 0, 0.05);
            --box-sub-bg: #f8fafc;
            --box-sub-border: #e2e8f0;
            --shadow: 0 10px 30px -10px rgba(2, 12, 27, 0.1);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Dark Theme Variables */
        [data-theme="dark"] {
            --primary: #020c1b;
            --secondary: #0a192f;
            --accent: #fca311;
            --accent-hover: #ffb703;
            --text-dark: #e6f1ff;
            --text-light: #ffffff;
            --bg-light: #0a192f;
            --card-bg: #112240;
            --card-border: rgba(255, 255, 255, 0.08);
            --box-sub-bg: #1d2d50;
            --box-sub-border: #233554;
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Language & Theme Bar */
        .top-bar {
            background-color: var(--primary);
            padding: 10px 24px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .bar-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--accent);
            color: #ffffff;
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .bar-btn.active, .bar-btn:hover {
            background-color: var(--accent);
            color: #0a192f;
            box-shadow: 0 0 10px rgba(252, 163, 17, 0.4);
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--text-light);
            text-align: center;
            padding: 40px 20px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            color: var(--accent);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.1rem;
            color: #8892b0;
            font-weight: 300;
            font-style: italic;
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: auto;
            padding: 60px 20px;
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Released Soon Card */
        .release-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--card-border);
            width: 100%;
            max-width: 600px;
        }

        .release-card h2 {
            font-size: 2.2rem;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .release-card p {
            color: var(--text-dark);
            opacity: 0.8;
            font-size: 1.05rem;
            margin-bottom: 25px;
        }

        /* Developer Badge */
        .developer-badge {
            padding: 12px 20px;
            background-color: var(--box-sub-bg);
            border: 1px dashed var(--box-sub-border);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        /* Footer */
        footer {
            background-color: var(--primary);
            color: #8892b0;
            text-align: center;
            padding: 25px;
            margin-top: auto;
            border-top: 3px solid var(--accent);
            font-size: 0.9rem;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            header h1 { font-size: 1.7rem; }
            header p { font-size: 0.95rem; }
            .top-bar { justify-content: center; }
            .release-card h2 { font-size: 1.8rem; }
        }
    </style>
</head>

<body onload="initApp()">

    <!-- Top Bar with Language and Dark Mode Toggle -->
    <div class="top-bar">
        <button onclick="toggleTheme()" id="theme-btn" class="bar-btn">🌙 Dark Mode</button>
        <button onclick="setLanguage('si')" id="btn-lang-si" class="bar-btn">සිංහල</button>
        <button onclick="setLanguage('en')" id="btn-lang-en" class="bar-btn active">English</button>
    </div>

    <!-- Header -->
    <header>
        <h1 id="school-title">A/ KAHAPATVILAGAMA VIDYALAYA</h1>
        <p id="tagline">"Moulding a Complete Human Being Through Education"</p>
    </header>

    <!-- Main Content Container -->
    <div class="container">
        <div class="release-card">
            <h2 id="release-title">Released Soon...</h2>
            <p id="release-sub">Our new website features are under development.</p>

            <!-- Developer Info -->
            <div class="developer-badge" id="dev-info">
                💻 Developer - Akarsha Idanindu
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p id="footer-text">&copy; 2026 A/ Kahapatvilagama Vidyalaya. All Rights Reserved.</p>
    </footer>

    <script>
        let currentLang = 'en';

        const translations = {
            si: {
                schoolName: "අ/ කහපත්විලගම විද්‍යාලය",
                tagline: '"අධ්‍යාපනයෙන් පරිපූර්ණ මිනිසෙකු බිහිකරමු"',
                releaseTitle: "ළඟදීම බලාපොරොත්තු වන්න...",
                releaseSub: "අපගේ නව වෙබ් අඩවිය නිර්මාණය වෙමින් පවතී.",
                devInfo: "💻 Developer - Akarsha Idanindu",
                footerText: "&copy; 2026 අ/ කහපත්විලගම විද්‍යාලය. සියලුම හිමිකම් ඇවිරිණි.",
                darkBtn: "🌙 Dark Mode",
                lightBtn: "☀️ Light Mode"
            },
            en: {
                schoolName: "A/ KAHAPATVILAGAMA VIDYALAYA",
                tagline: '"Moulding a Complete Human Being Through Education"',
                releaseTitle: "Released Soon...",
                releaseSub: "Our new website features are under development.",
                devInfo: "💻 Developer - Akarsha Idanindu",
                footerText: "&copy; 2026 A/ Kahapatvilagama Vidyalaya. All Rights Reserved.",
                darkBtn: "🌙 Dark Mode",
                lightBtn: "☀️ Light Mode"
            }
        };

        function initApp() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            setLanguage('en');
            updateThemeButtonText();
        }

        /* --- Theme Toggle Logic --- */
        function toggleTheme() {
            let currentTheme = document.documentElement.getAttribute('data-theme');
            let newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            updateThemeButtonText();
        }

        function updateThemeButtonText() {
            let theme = document.documentElement.getAttribute('data-theme');
            const themeBtn = document.getElementById('theme-btn');
            if (theme === 'dark') {
                themeBtn.innerText = translations[currentLang].lightBtn;
            } else {
                themeBtn.innerText = translations[currentLang].darkBtn;
            }
        }

        /* --- Language Toggle Logic --- */
        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-lang-si').classList.toggle('active', lang === 'si');
            document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');

            const t = translations[lang];
            document.getElementById('school-title').innerText = t.schoolName;
            document.getElementById('tagline').innerText = t.tagline;
            document.getElementById('release-title').innerText = t.releaseTitle;
            document.getElementById('release-sub').innerText = t.releaseSub;
            document.getElementById('dev-info').innerText = t.devInfo;
            document.getElementById('footer-text').innerHTML = t.footerText;

            updateThemeButtonText();
        }
    </script>

</body>
</html>
